<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorization — NewsRiseMedia</title><style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0c1026;color:#e8eaf6}main{max-width:720px;margin:0 auto;padding:48px 24px}code{background:#161b3a;padding:12px 16px;border-radius:8px;display:block;word-break:break-all;font-size:1.05rem;margin:16px 0}</style></head><body><main><h1>Authorization received</h1><p id="msg">Copy the code below back into the NewsRiseMedia Publisher terminal:</p><code id="code">…</code><script>const p=new URLSearchParams(location.search);const c=p.get('code');const e=p.get('error');document.getElementById('code').textContent=c||e||'no code in URL';if(e){document.getElementById('msg').textContent='Authorization failed:';}</script></main></body></html>
